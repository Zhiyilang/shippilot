name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the assertion suite
        run: python eval.py

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the example repository
        run: python -m shippilot audit --root examples/demo_repo || true
      - name: Ship hands-off
        run: python -m shippilot ship --root examples/demo_repo --autonomy hands-off || true
      - name: Self audit
        run: python -m shippilot audit --root . || true

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gradio>=6"
      - run: python -c "import app; app.build(); print('gradio blocks build ok')"
